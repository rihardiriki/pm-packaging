<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>PM – Permintaan Packaging</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--pri:#2548D0;--bg:#F8FAFC;--card:#fff;--bd:#E2E8F0;--tx:#0F172A;--tx2:#64748B;--mut:#94A3B8;--sub:#F1F5F9;--gr:#059669;--grb:#ECFDF5;--am:#D97706;--amb:#FFFBEB;--red:#DC2626;--redb:#FEF2F2;--pb:#EFF6FF;--sh:0 2px 8px -2px rgba(15,23,42,.05),0 1px 3px -1px rgba(15,23,42,.04);--sh2:0 8px 24px -4px rgba(37,72,208,.18),0 4px 8px -2px rgba(15,23,42,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1120;--card:#162033;--bd:#26334A;--tx:#F1F5F9;--tx2:#94A3B8;--mut:#64748B;--sub:#1E2A40;--grb:#073B2B;--amb:#3A2A08;--redb:#3B1414;--pb:#1B2A52;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1120;--card:#162033;--bd:#26334A;--tx:#F1F5F9;--tx2:#94A3B8;--mut:#64748B;--sub:#1E2A40;--grb:#073B2B;--amb:#3A2A08;--redb:#3B1414;--pb:#1B2A52;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/20px 'Plus Jakarta Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
#app{max-width:480px;margin:0 auto;padding:0 16px 170px}
header{display:flex;align-items:center;gap:10px;padding:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header .lg{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:700}
header div{flex:1;min-width:0}header small{color:var(--tx2);font-size:11px;display:block}header h1{margin:0;font-size:20px;line-height:26px;font-weight:700}
.av{width:38px;height:38px;border-radius:50%;background:var(--pb);color:var(--pri);font-weight:700}
.hero{background:linear-gradient(135deg,#1E3A8A,#2548D0 60%,#4766E5);color:#fff;border-radius:16px;padding:16px;box-shadow:var(--sh2);margin-bottom:14px}
.hero h2{margin:0;font-size:20px;line-height:28px}.hero p{margin:2px 0 0;color:#C2CBFF}
.seg{display:inline-flex;background:rgba(255,255,255,.15);border-radius:99px;padding:3px;margin-top:12px}.seg button{padding:6px 14px;border-radius:99px;font-weight:600;font-size:13px;color:#fff}.seg .on{background:#fff;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.g3 .card{text-align:center;padding:12px 6px;margin:0}.g3 b{display:block;font-size:24px;line-height:30px}.g3 small{color:var(--tx2);font-size:11px}
h3{font-size:17px;line-height:24px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center}h3 a{font-size:13px;color:var(--pri);font-weight:600}
.btn{height:50px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;font-size:15px;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:var(--sh2)}
.btn:active{transform:scale(.98);background:#1E3A8A}.btn.s{background:var(--pb);color:var(--pri);box-shadow:none;height:48px}.btn.d{background:var(--redb);color:var(--red);box-shadow:none;height:44px;border-radius:10px}.btn.am{background:var(--am)}.btn.sm{height:40px;font-size:13px;width:auto;flex:1;box-shadow:none}
.row{display:flex;gap:8px}.ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:19px;flex:none}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:left;box-shadow:var(--sh)}.quick b{display:block;margin-top:6px;font-size:13px;line-height:17px}.quick small{color:var(--tx2);font-size:11px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:11px;font-weight:700;border:1px solid}.pill.gr{background:var(--grb);color:var(--gr);border-color:#A7F3D0}.pill.am{background:var(--amb);color:var(--am);border-color:#FDE68A}
.rq{padding:14px}.rq .t{display:flex;gap:10px;align-items:flex-start}.rq .t>div{flex:1;min-width:0}.rq b.n{font-size:15px}.rq small{color:var(--tx2);display:block}
.box{background:var(--sub);border-radius:12px;padding:10px;margin:10px 0}.box>small b{color:var(--tx)}
.ch{display:inline-block;background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:12px;margin:4px 4px 0 0;color:var(--tx2)}
.ib{width:36px;height:36px;border-radius:8px;background:var(--sub);flex:none;font-size:14px}.ib.rd{background:var(--redb);color:var(--red)}
.f{display:block;margin-bottom:12px;font-size:12px;color:var(--tx2);font-weight:600}.f input,.f select,.f textarea,.in{display:block;width:100%;margin-top:4px;height:48px;background:var(--card);border:1.5px solid #CBD5E1;border-radius:10px;padding:0 14px;font:400 14px 'Plus Jakarta Sans',sans-serif;color:var(--tx)}
.f textarea{height:72px;padding:10px 14px;resize:none}.f input:focus,.f select:focus,.f textarea:focus,.in:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px rgba(37,72,208,.15)}
[data-mi=name]{text-transform:uppercase}.ln.bad{border-color:var(--red);background:var(--redb)}.lh{display:flex;gap:10px;align-items:center}.lh .g{flex:1;min-width:0}.lh .g b{font-size:16px;margin-right:6px}.lh small{display:block;color:var(--tx2)}
.sr{display:flex;justify-content:space-between;align-items:center;background:var(--sub);border-radius:12px;padding:8px 10px;margin-top:12px}
.st{display:flex;gap:6px}.st button{width:40px;height:40px;border-radius:8px;background:var(--card);font-size:20px;font-weight:700;box-shadow:var(--sh2)}.st input{width:58px;height:40px;text-align:center;font:700 18px 'Plus Jakarta Sans';border:1.5px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.add{width:100%;border:1.5px dashed var(--pri);color:var(--pri);border-radius:16px;padding:14px;font-weight:700;background:var(--card);margin-bottom:12px}
.em{text-align:center;color:var(--tx2);padding:28px 12px}.em b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px}.chip{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--card) 95%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding:10px 16px;z-index:6}.bar>div{max-width:480px;margin:auto;display:flex;gap:10px}.bar .s{width:auto;padding:0 16px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:7}nav div{max-width:480px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}nav button{height:64px;font-size:11px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}nav button span{font-size:20px;line-height:22px}nav .on{color:var(--pri)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20}.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;max-height:88%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:21;box-shadow:var(--sh2)}.sheet:before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--bd);margin:0 auto 12px}.sheet h4{margin:0 0 12px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.mc{text-align:left;background:var(--card);border:1.5px solid var(--bd);border-radius:16px;padding:12px;position:relative;box-shadow:var(--sh)}.mc.on{border-color:var(--pri);background:var(--pb)}.mc.on:after{content:"✓";position:absolute;right:-6px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:13px}
.mc .ic{border-radius:12px;background:var(--t)}.mc small{position:absolute;right:10px;top:10px;background:var(--sub);border-radius:6px;padding:0 6px;font-size:11px;color:var(--tx2)}.mc b{display:block;margin-top:8px;font-size:15px;line-height:19px}.mc em{font-style:normal;color:var(--tx2);font-size:12px}
.vc{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.vc .chip{display:flex;gap:6px;align-items:center}.vc .chip i{font-style:normal;opacity:.7}
.toast{position:fixed;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:448px;margin:auto;background:#2F3038;color:#F1EFFB;border-radius:12px;padding:12px 16px;z-index:30;display:flex;justify-content:space-between;gap:10px}.toast button{color:#B9C3FF;font-weight:700}
.paper{background:#fff;color:#0F172A;border-radius:12px;border-top:6px solid #2548D0;padding:16px;box-shadow:var(--sh2);font-size:12px;line-height:17px}.paper h5{margin:0;font-size:15px;color:#2548D0}.paper table{width:100%;border-collapse:collapse;margin:12px 0}.paper th{background:#F1F5F9;text-align:left;padding:6px;font-size:11px}.paper td{padding:6px;border-bottom:1px solid #E2E8F0;vertical-align:top}.paper .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F8FAFC;padding:10px;border-radius:8px}.paper .meta small{color:#64748B;display:block;font-size:10px}.paper .nt{background:#FFFBEB;border-radius:8px;padding:8px;margin:10px 0}.paper .sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}.paper .sg div{border:1px solid #E2E8F0;border-radius:8px;padding:8px;height:88px;display:flex;flex-direction:column;justify-content:space-between}.paper .sg small{color:#64748B}
@page{size:A4;margin:12mm}
@media print{body *{visibility:hidden}#paper,#paper *{visibility:visible}#paper{position:absolute;left:0;top:0;width:100%;box-shadow:none;border-radius:0;font-size:12px}}
</style></head><body>
<div id="app"></div><div id="sh"></div><div id="tt"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const K='pm_app_v1',pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const CATS={kayu:['Kayu & Pallet','#EFF6FF'],ikat:['Pengikat & Film','#ECFDF5'],lindung:['Pelindung','#FEF3C7']};
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const M0=[['Pallet','kayu','📦',[],['pcs']],['Particle','kayu','🪵',[],['lembar','pallet']],['Pefoam','lindung','🧽',[],['pcs','lembar']],['Coreplug','lindung','⭕',[],['karung']],['Tali','ikat','➰',[],['roll']],['Stretch Film','ikat','🎞️',[],['box']],['Paku','ikat','📌',[],['kg','box']],['Penyangga','kayu','📐',[],['pcs']],['List','kayu','➖',[],['pcs']],['Stopper','lindung','⛔',[],['karung']],['Layer Besi','lindung','🔲',[],['rak']],['Pallet Plastik','kayu','🟦',[],['pcs']]].map((a,i)=>({id:'i'+i,name:a[0].toUpperCase(),cat:a[1],ic:a[2],variants:a[3],units:a[4]}));
const fresh=()=>({profile:{name:'',dept:'',co:''},items:JSON.parse(JSON.stringify(M0)),reqs:[],cur:null,doc:null});
let S=fresh();try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const UP=n=>(n==='Partikel / Triplex / Flywood'?'Particle':String(n)).toUpperCase();
S.items.forEach(i=>i.name=UP(i.name));S.reqs.forEach(r=>{r.lines.forEach(l=>l.nm=UP(l.nm));if(r.status==='final')r.lines=mgl(r.lines)});if(S.cur)S.cur.lines.forEach(l=>l.nm=UP(l.nm));
if(!S.mv){const NV=['PARTICLE','TALI'],cl=r=>r.lines.forEach(l=>{if(NV.includes(l.nm))l.variant=''});S.items.forEach(i=>{if(NV.includes(i.name))i.variants=[]});S.reqs.forEach(r=>{if(r.status==='draft')cl(r)});if(S.cur)cl(S.cur);S.mv=1}
if(S.mv<2){const NV=['LAYER BESI','PALLET PLASTIK'],cl=r=>r.lines.forEach(l=>{if(NV.includes(l.nm))l.variant=''});S.items.forEach(i=>{if(NV.includes(i.name))i.variants=[]});S.reqs.forEach(r=>{if(r.status==='draft')cl(r)});if(S.cur)cl(S.cur);S.mv=2}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let V={tab:'home',rg:'day',q:'',f:'all',cat:'all',sel:[],sheet:null,bad:[],lid:null,mi:null,cv:false,cf:null};
const it=id=>S.items.find(i=>i.id===id),ln=id=>S.cur&&S.cur.lines.find(l=>l.id===id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fd=s=>{const[y,m,d]=s.split('-');return d+' '+MON[m-1]+' '+y},ft=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const sum=r=>Math.round(r.lines.reduce((a,l)=>a+(+l.qty||0),0)*100)/100,needsV=l=>{const m=it(l.itemId);return m&&m.variants.length>0&&!l.variant};
const lbl=l=>l.nm+(l.variant?' '+l.variant:''),qs=l=>(l.qty===''?'–':l.qty)+' '+l.unit;
function nextNo(d){const p='PM-'+d.replace(/-/g,'')+'-';let m=0;S.reqs.forEach(r=>{if(r.no.startsWith(p))m=Math.max(m,+r.no.slice(p.length)||0)});return p+String(m+1).padStart(3,'0')}
const newReq=()=>{const d=today();return{id:'r'+uid(),no:nextNo(d),date:d,name:S.profile.name,dept:S.profile.dept,ref:'',note:'',status:'draft',lines:[],at:Date.now()}};
function up(){const c=JSON.parse(JSON.stringify(S.cur));c.at=Date.now();const i=S.reqs.findIndex(r=>r.id===c.id);i<0?S.reqs.unshift(c):S.reqs[i]=c;save()}
function stash(){if(S.cur&&S.cur.lines.length&&!S.reqs.some(r=>r.id===S.cur.id))up()}
function tst(m,undo){const t=$('#tt');t.innerHTML=`<div class=toast><span>${esc(m)}</span>${undo?'<button data-a=undo>Urungkan</button>':''}</div>`;clearTimeout(tst.h);tst.h=setTimeout(()=>t.innerHTML='',4000);tst.u=undo}
function card(r){const fin=r.status==='final',ch=r.lines.slice(0,3).map(l=>`<span class=ch>${esc(lbl(l))} (${esc(qs(l))})</span>`).join('')+(r.lines.length>3?`<span class=ch>+${r.lines.length-3} lainnya</span>`:'');
return `<div class="card rq"><div class=t><span class=ic style="background:${fin?'var(--grb)':'var(--amb)'}">${fin?'✔':'✎'}</span><div><b class=n>${esc(r.no)}</b><small>${fd(r.date)} • ${ft(r.at)}</small></div><span class="pill ${fin?'gr':'am'}">${fin?'Final':'Draft'}</span></div><div class=box><small>Pemohon: <b>${esc(r.name||'-')}</b>${r.dept?' ('+esc(r.dept)+')':''} • ${r.lines.length} jenis item</small>${ch||'<small>Belum ada item</small>'}</div><div class=row><button class="ib rd" data-a=dr data-id=${r.id}>🗑</button><button class="btn s sm" data-a=dup data-id=${r.id}>Duplikat</button>${fin?`<button class="btn s sm" data-a=ed data-id=${r.id}>Edit</button><button class="btn sm" data-a=vw data-id=${r.id}>Cetak PDF</button>`:`<button class="btn am sm" data-a=ed data-id=${r.id}>Lanjutkan</button>`}</div></div>`}
function vHome(){const now=Date.now(),st=V.rg==='day'?new Date().setHours(0,0,0,0):now-6048e5,L=S.reqs.filter(r=>r.at>=st);
return `<div class=hero><h2>Halo, ${esc(S.profile.name||'Pengguna')} 👋</h2><p>${esc(S.profile.dept||'Atur profil di Pengaturan')}</p><div class=seg><button class="${V.rg==='day'?'on':''}" data-a=rg data-v=day>Hari Ini</button><button class="${V.rg==='week'?'on':''}" data-a=rg data-v=week>Minggu Ini</button></div></div>
<div class=g3><div class=card><b>${L.length}</b><small>Total dibuat</small></div><div class=card><b style="color:var(--am)">${L.filter(r=>r.status==='draft').length}</b><small>Draft aktif</small></div><div class=card><b style="color:var(--gr)">${L.filter(r=>r.status==='final').length}</b><small>Siap cetak</small></div></div>
<button class=btn data-a=new>＋ Buat Permintaan Baru</button>
<h3>Aksi cepat</h3><div class=quick><button data-a=tab data-v=mst><span class=ic style="background:var(--amb)">🔲</span><b>Varian Item</b><small>Master unit</small></button><button data-a=tab data-v=doc><span class=ic style="background:var(--pb)">🖨</span><b>Cetak Ulang</b><small>Arsip PDF</small></button><button data-a=tab data-v=mst><span class=ic style="background:#F3E8FF">▦</span><b>${S.items.length} Master</b><small>Katalog bahan</small></button></div>
<h3>Riwayat terkini <a data-a=tab data-v=hist>Lihat semua</a></h3>${S.reqs.slice(0,3).map(card).join('')||'<div class="card em"><b>Belum ada permintaan</b>Tekan “Buat Permintaan Baru” untuk memulai.</div>'}`}
function stepper(l){return `<div class=st><button data-a=mn data-id=${l.id} aria-label=Kurangi>−</button><input inputmode=decimal data-l=${l.id} data-lk=qty value="${l.qty}" placeholder=0 aria-label=Jumlah><button data-a=pl data-id=${l.id} aria-label=Tambah>+</button></div>`}
function vForm(){const c=S.cur;
const L=c.lines.map(l=>{const m=it(l.itemId),nv=needsV(l);return `<div class="card ln ${V.bad.includes(l.id)?'bad':''}"><div class=lh><span class=ic style="background:${m?CATS[m.cat][1]:'var(--sub)'}">${m?m.ic:'📦'}</span><div class=g><b>${esc(l.nm)}</b>${l.variant?`<span class="pill gr">${esc(l.variant)}</span>`:nv?'<span class="pill am">Pilih varian</span>':''}<small>${esc(l.note||'Tanpa ukuran/catatan')}</small></div><button class=ib data-a=el data-id=${l.id} aria-label=Edit>✎</button><button class="ib rd" data-a=dl data-id=${l.id} aria-label=Hapus>🗑</button></div><div class=sr><span>Satuan: <b>${esc(l.unit)}</b></span>${stepper(l)}</div><button class=chip data-a=dpl data-id=${l.id} style="margin-top:10px">＋ Tambah ukuran / varian lain</button></div>`}).join('');
return `<div class=hero><small style="color:#C2CBFF">${c.status==='final'?'DOKUMEN FINAL (diedit)':'DOKUMEN BARU'}</small><h2>Form Permintaan Material</h2><p>No. ${esc(c.no)}</p></div>
<div class=card><label class=f>Tanggal permintaan<input type=date data-f=date value="${c.date}"></label><label class=f>Nama pemohon<input data-f=name value="${esc(c.name)}" placeholder="Nama lengkap"></label><label class=f>Departemen / divisi<input data-f=dept value="${esc(c.dept)}" placeholder="mis. PPIC"></label><label class=f>Tujuan / No. order (opsional)<input data-f=ref value="${esc(c.ref)}"></label><label class=f style="margin:0">Catatan khusus untuk gudang<textarea data-f=note>${esc(c.note)}</textarea></label></div>
<h3>Daftar item packaging <small id=sm style="font-size:12px;color:var(--tx2)">${c.lines.length} jenis • total ${sum(c)}</small></h3>${L||'<div class="card em"><b>Belum ada item</b>Tambahkan item packaging yang dibutuhkan.</div>'}<button class=add data-a=pick>＋ Tambah Item Packaging</button>`}
function vHist(){const n=s=>S.reqs.filter(r=>s==='all'||r.status===s).length,q=V.q.toLowerCase();
const L=S.reqs.filter(r=>(V.f==='all'||r.status===V.f)&&(r.no+r.name+r.ref).toLowerCase().includes(q));
return `<input class=in data-q=1 placeholder="Cari no. permintaan, pemohon…" value="${esc(V.q)}"><div class=chips style="margin-top:10px">${[['all','Semua'],['draft','Draft'],['final','Final']].map(a=>`<button class="chip ${V.f===a[0]?'on':''}" data-a=flt data-v=${a[0]}>${a[1]} ${n(a[0])}</button>`).join('')}</div><div id=hl>${hl(L)}</div>`}
const hl=L=>L.map(card).join('')||'<div class="card em"><b>Tidak ada permintaan</b>Riwayat akan muncul setelah Anda membuat permintaan.</div>';
function paper(r){return `<div class=paper id=paper><div style="display:flex;justify-content:space-between"><div><h5>PERMINTAAN PACKAGING</h5><b>${esc(S.profile.co||'Perusahaan')}</b></div><span>${r.status==='final'?'FINAL':'DRAFT'}</span></div><div class=meta style="margin-top:10px"><div><small>NO. PERMINTAAN</small><b>${esc(r.no)}</b></div><div><small>PEMOHON / DEPT</small><b>${esc(r.name||'-')}${r.dept?' ('+esc(r.dept)+')':''}</b></div><div><small>TANGGAL</small><b>${fd(r.date)}</b></div><div><small>TUJUAN / NO. REF</small><b>${esc(r.ref||'-')}</b></div></div><table><tr><th>No</th><th>Item & varian</th><th>Keterangan</th><th>Qty</th></tr>${r.lines.map((l,i)=>`<tr><td>${i+1}</td><td><b>${esc(l.nm)}</b>${l.variant?'<br>'+esc(l.variant):''}</td><td>${esc(l.note||'')}</td><td><b>${l.qty===''?'–':l.qty}</b> ${esc(l.unit)}</td></tr>`).join('')||'<tr><td colspan=4>Tidak ada item</td></tr>'}</table><div>Total: <b>${r.lines.length} jenis item</b> • Kuantitas: <b>${sum(r)}</b> unit</div>${r.note?`<div class=nt><b>Catatan khusus:</b> ${esc(r.note)}</div>`:''}<div class=sg><div><small>Pemohon</small><span>( ${esc(r.name||'........')} )</span></div><div><small>Mengetahui</small><span>( ........ )</span></div><div><small>Penerima</small><span>( ........ )</span></div></div></div>`}
function vDoc(){const r=S.reqs.find(x=>x.id===S.doc)||S.reqs[0];if(!r)return '<div class="card em"><b>Belum ada dokumen</b>Finalkan permintaan untuk melihat pratinjau dan mencetak.</div>';
return `<label class=f>Dokumen<select data-d=1>${S.reqs.map(x=>`<option value=${x.id} ${x.id===r.id?'selected':''}>${esc(x.no)} – ${x.status}</option>`).join('')}</select></label>${paper(r)}<div style="margin-top:12px;display:grid;gap:10px"><button class=btn data-a=pr>🖨 Cetak Dokumen Sekarang</button><div class=row><button class="btn s" data-a=pdfd>⬇ Unduh PDF</button><button class="btn s" data-a=wa>↗ Kirim WhatsApp</button></div><button class="btn s" data-a=ed data-id=${r.id}>✎ Edit permintaan</button></div>`}
function vMst(){return `<button class=btn data-a=nmi style="margin-bottom:12px">＋ Tambah Master Item</button>`+S.items.map(i=>`<div class="card rq"><div class=t><span class=ic style="background:${CATS[i.cat][1]}">${i.ic}</span><div><b class=n>${esc(i.name)}</b><small>${CATS[i.cat][0]}</small></div><button class=ib data-a=emi data-id=${i.id}>✎</button></div><div>${i.variants.map(v=>`<span class="pill gr" style="margin:6px 4px 0 0">${esc(v)}</span>`).join('')||'<small>Tanpa varian</small>'}</div><div>${i.units.map(u=>`<span class=ch>${esc(u)}</span>`).join('')}</div></div>`).join('')}
function vSet(){const p=S.profile;return `<div class=card><label class=f>Nama pemohon default<input data-p=name value="${esc(p.name)}"></label><label class=f>Departemen default<input data-p=dept value="${esc(p.dept)}"></label><label class=f style="margin:0">Nama perusahaan (header PDF)<input data-p=co value="${esc(p.co)}"></label></div><button class="btn s" data-a=tab data-v=mst style="margin-bottom:10px">▦ Kelola master item & varian</button><button class="btn d" data-a=rst style="width:100%">Hapus semua data</button>`}
function sheet(){const s=V.sheet;if(!s)return '';let h='';
if(s==='pick'){const cs=['all',...Object.keys(CATS)];h=`<h4>Katalog master item</h4><input class=in data-q=2 placeholder="Cari master item…" value="${esc(V.q)}"><div class=chips style="margin-top:10px">${cs.map(c=>`<button class="chip ${V.cat===c?'on':''}" data-a=cat data-v=${c}>${c==='all'?'Semua ('+S.items.length+')':CATS[c][0]}</button>`).join('')}</div><div class=grid id=gr>${grid()}</div><button class=btn data-a=addsel>Tambahkan ke permintaan (${V.sel.length} item)</button>`}
if(s==='line'){const l=ln(V.lid),m=it(l.itemId),us=[...new Set([...(m?m.units:[]),l.unit])];h=`<h4>${esc(l.nm)}</h4>${m&&m.variants.length||l.variant?`<b style="font-size:13px">Pilih varian ${m&&m.variants.length?'<span style="color:var(--red)">*</span>':''}</b><div class=vc>${(m?m.variants:[]).map(v=>`<button class="chip ${l.variant===v?'on':''}" data-a=sv data-v="${esc(v)}">${esc(v)}</button>`).join('')}${l.variant&&!(m&&m.variants.includes(l.variant))?`<button class="chip on" data-a=sv data-v="${esc(l.variant)}">${esc(l.variant)}</button>`:''}<button class=chip data-a=cvt style="background:var(--amb)">＋ Varian khusus</button></div>`:`<div class=vc><button class=chip data-a=cvt style="background:var(--amb)">＋ Varian khusus</button></div>`}${V.cv?`<div class=row style="margin-bottom:8px"><input class=in id=cvi placeholder="Nama varian"><button class="btn sm" data-a=cva style="flex:none;width:80px;height:48px">Pakai</button></div><label style="font-size:12px;display:block;margin-bottom:10px"><input type=checkbox id=cvs checked> Simpan ke daftar varian item</label>`:''}<div class=row><label class=f style="flex:1">Jumlah${stepper(l).replace('class=st','class=st style="margin-top:4px"')}</label><label class=f style="flex:1">Satuan<select data-l=${l.id} data-lk=unit>${us.map(u=>`<option ${u===l.unit?'selected':''}>${esc(u)}</option>`).join('')}</select></label></div><label class=f>Ukuran / catatan (opsional)<input data-l=${l.id} data-lk=note value="${esc(l.note)}" placeholder="mis. ukuran 1200 × 1000"></label><div class=row><button class="btn d" data-a=dl data-id=${l.id} style="flex:1">Hapus item</button><button class=btn data-a=cs style="flex:2">Selesai</button></div>`}
if(s==='mi'){const i=V.mi,ch=(k)=>`<div class=vc>${i[k].map((v,x)=>`<span class=chip>${esc(v)} <i data-a=rm data-k=${k} data-x=${x}>✕</i></span>`).join('')}</div><div class=row style="margin-bottom:12px"><input class=in id=add_${k} placeholder="Tambah ${k==='variants'?'varian':'satuan'}"><button class="btn s sm" data-a=ad data-k=${k} style="flex:none;width:80px;height:48px">Tambah</button></div>`;
h=`<h4>${i.isNew?'Master item baru':'Edit master item'}</h4><label class=f>Nama item<input data-mi=name value="${esc(i.name)}"></label><label class=f>Kategori<select data-mi=cat>${Object.keys(CATS).map(c=>`<option value=${c} ${i.cat===c?'selected':''}>${CATS[c][0]}</option>`).join('')}</select></label><b style="font-size:13px">Varian</b>${ch('variants')}<b style="font-size:13px">Satuan (yang pertama = default)</b>${ch('units')}<div class=row>${i.isNew?'':'<button class="btn d" data-a=dmi style="flex:1">Hapus</button>'}<button class=btn data-a=smi style="flex:2">Simpan</button></div>`}
if(s==='cf')h=`<h4>${esc(V.cf.m)}</h4><div class=row><button class="btn s" data-a=cs style="flex:1">Batal</button><button class="btn d" data-a=ok style="flex:1">Ya, lanjutkan</button></div>`;
return `<div class=ov data-a=cs></div><div class=sheet>${h}</div>`}
function grid(){const q=V.q.toLowerCase();return S.items.filter(i=>(V.cat==='all'||i.cat===i.cat&&i.cat===V.cat)&&i.name.toLowerCase().includes(q)).map(i=>`<button class="mc ${V.sel.includes(i.id)?'on':''}" data-a=pk data-id=${i.id}><span class=ic style="--t:${CATS[i.cat][1]}">${i.ic}</span><small>${esc(i.units[0]||'')}</small><b>${esc(i.name)}</b><em>${i.variants.length?'Varian: '+esc(i.variants.join(', ')):'Tanpa varian'}</em></button>`).join('')||'<p class=em>Tidak ada item.</p>'}
function render(){const t=V.tab,T={home:'Beranda',form:'Buat Permintaan',hist:'Riwayat',doc:'Dokumen',set:'Pengaturan',mst:'Katalog Master'}[t],nv=[['home','⌂','Beranda'],['form','＋','Permintaan'],['hist','◷','Riwayat'],['doc','▤','Dokumen']];
const body={home:vHome,form:vForm,hist:vHist,doc:vDoc,set:vSet,mst:vMst}[t]();
const sub=t==='set'||t==='mst';
$('#app').innerHTML=`<header>${sub?'<button class=av data-a=tab data-v=home>←</button>':'<span class=lg>PM</span>'}<div><small>Aplikasi permintaan packaging</small><h1>${T}</h1></div><button class=av data-a=tab data-v=set aria-label=Pengaturan>${esc((S.profile.name||'?')[0].toUpperCase())}</button></header>${body}${t==='form'?`<div class=bar><div><button class="btn s" data-a=sd>🔖 Simpan Draft</button><button class=btn data-a=fin>Pratinjau & Cetak →</button></div></div>`:''}<nav><div>${nv.map(n=>`<button class="${t===n[0]?'on':''}" data-a=tab data-v=${n[0]}><span>${n[1]}</span>${n[2]}</button>`).join('')}</div></nav>`;
$('#sh').innerHTML=sheet()}
function go(t){V.tab=t;V.q='';V.f='all';V.bad=[];if(t==='form'&&!S.cur){S.cur=newReq();save()}render();scrollTo(0,0)}
function open(r){stash();S.cur=JSON.parse(JSON.stringify(r));save();go('form')}
function mgl(a){const o=[];a.forEach(l=>{const k=[l.itemId,l.variant,l.unit,(l.note||'').trim().toLowerCase()].join('|'),x=o.find(z=>z.k===k);if(x)x.l.qty=Math.round(((+x.l.qty||0)+(+l.qty||0))*100)/100;else o.push({k,l:{...l}})});return o.map(z=>z.l)}
function fin(){const c=S.cur;V.bad=[];let m='';if(!c.lines.length)m='Tambahkan minimal 1 item.';c.lines.forEach(l=>{if(!(+l.qty>0)||needsV(l))V.bad.push(l.id)});if(!m&&V.bad.length)m='Isi jumlah (lebih dari 0) dan pilih varian pada item bertanda merah.';if(!m&&!c.name.trim())m='Isi nama pemohon.';if(m){tst(m);render();return}c.status='final';c.lines=mgl(c.lines);up();S.doc=c.id;S.cur=null;save();go('doc')}
function mv(l,d){let q=Math.round(((+l.qty||0)+d)*100)/100;l.qty=q>0?q:'';save();render()}
const cur=()=>S.reqs.find(x=>x.id===S.doc)||S.reqs[0];
function act(a,d){const l=d.id&&ln(d.id);
if(a==='tab')go(d.v);
else if(a==='new'){stash();S.cur=newReq();save();go('form')}
else if(a==='rg'){V.rg=d.v;render()}
else if(a==='flt'){V.f=d.v;render()}
else if(a==='ed'||a==='dup'){const r=S.reqs.find(x=>x.id===d.id);if(!r)return;const c=JSON.parse(JSON.stringify(r));if(a==='dup'){c.id='r'+uid();c.no=nextNo(today());c.date=today();c.status='draft';c.lines.forEach(x=>x.id=uid())}open(c)}
else if(a==='vw'){S.doc=d.id;save();go('doc')}
else if(a==='dr'){V.cf={m:'Hapus permintaan ini?',f:()=>{S.reqs=S.reqs.filter(r=>r.id!==d.id);if(S.cur&&S.cur.id===d.id)S.cur=null;save()}};V.sheet='cf';render()}
else if(a==='pick'){V.sel=[];V.q='';V.cat='all';V.sheet='pick';render()}
else if(a==='cat'){V.cat=d.v;render()}
else if(a==='pk'){V.sel=V.sel.includes(d.id)?V.sel.filter(x=>x!==d.id):[...V.sel,d.id];$('#gr').innerHTML=grid();document.querySelector('[data-a=addsel]').textContent=`Tambahkan ke permintaan (${V.sel.length} item)`}
else if(a==='addsel'){let sk=0;V.sel.forEach(id=>{const m=it(id);S.cur.lines.push({id:uid(),itemId:id,nm:m.name,variant:'',qty:'',unit:m.units[0]||'pcs',note:''})});V.sheet=null;save();render();}
else if(a==='el'){V.lid=d.id;V.cv=false;V.sheet='line';render()}
else if(a==='dl'){const i=S.cur.lines.findIndex(x=>x.id===d.id),x=S.cur.lines[i];S.cur.lines.splice(i,1);V.sheet=null;save();render();tst('Item dihapus',()=>{S.cur.lines.splice(i,0,x);save();render()})}
else if(a==='dpl'){const i=S.cur.lines.findIndex(x=>x.id===d.id),n={...S.cur.lines[i],id:uid(),qty:'',note:''};S.cur.lines.splice(i+1,0,n);V.lid=n.id;V.cv=false;V.sheet='line';save();render()}
else if(a==='undo'){tst.u&&tst.u();$('#tt').innerHTML=''}
else if(a==='mn')mv(l,-1);else if(a==='pl')mv(l,1);
else if(a==='sv'){const x=ln(V.lid);x.variant=x.variant===d.v?'':d.v;save();render()}
else if(a==='cvt'){V.cv=!V.cv;render()}
else if(a==='cva'){const v=$('#cvi').value.trim();if(!v)return;const x=ln(V.lid),m=it(x.itemId);x.variant=v;if(m&&$('#cvs').checked&&!m.variants.includes(v))m.variants.push(v);V.cv=false;save();render()}
else if(a==='cs'){V.sheet=null;render()}
else if(a==='ok'){V.cf.f();V.sheet=null;render()}
else if(a==='sd'){if(!S.cur.lines.length){tst('Tambahkan item sebelum menyimpan draft.');return}S.cur.status='draft';up();tst('Draft tersimpan di Riwayat')}
else if(a==='fin')fin();
else if(a==='pr'){document.title=cur().no;try{print()}catch(e){tst('Cetak tidak tersedia di tampilan ini')}}
else if(a==='pdf'){document.title=cur().no;tst('Pilih “Simpan sebagai PDF” pada dialog cetak');setTimeout(()=>{try{print()}catch(e){}},700)}
else if(a==='pdfd'){const r=cur();if(!window.jspdf){tst('Pustaka PDF belum termuat (butuh internet), gunakan Cetak');return}try{const buf=mkpdf(r);if(DL)DL.save({filename:r.no+'.pdf',data:buf}).then(()=>tst('PDF tersimpan'),e=>{if(e.code!=='declined')tst('Gagal menyimpan PDF')});else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));a.download=r.no+'.pdf';document.body.appendChild(a);a.click();a.remove();tst('PDF diunduh')}}catch(e){tst('Gagal membuat PDF')}}
else if(a==='wa'){const r=cur(),t=`*PERMINTAAN PACKAGING*\nNo: ${r.no}\nTanggal: ${fd(r.date)}\nPemohon: ${r.name}${r.dept?' ('+r.dept+')':''}\n\n`+r.lines.map((x,i)=>`${i+1}. ${lbl(x)}${x.note?' – '+x.note:''} – ${qs(x)}`).join('\n')+(r.note?'\n\nCatatan: '+r.note:'');window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank')}
else if(a==='nmi'){V.mi={isNew:1,id:'i'+uid(),name:'',cat:'kayu',ic:'📦',variants:[],units:['pcs']};V.sheet='mi';render()}
else if(a==='emi'){V.mi=JSON.parse(JSON.stringify(it(d.id)));V.sheet='mi';render()}
else if(a==='rm'){V.mi[d.k].splice(+d.x,1);render()}
else if(a==='ad'){const e=$('#add_'+d.k),v=e.value.trim();if(v&&!V.mi[d.k].includes(v))V.mi[d.k].push(v);render()}
else if(a==='smi'){const i=V.mi;if(!i.name.trim()){tst('Isi nama item.');return}if(!i.units.length)i.units=['pcs'];const n=JSON.parse(JSON.stringify(i));delete n.isNew;n.name=n.name.trim().toUpperCase();const x=S.items.findIndex(z=>z.id===n.id);x<0?S.items.push(n):S.items[x]=n;V.sheet=null;save();render()}
else if(a==='dmi'){const id=V.mi.id;V.cf={m:'Hapus master item ini? Permintaan lama tidak berubah.',f:()=>{S.items=S.items.filter(z=>z.id!==id);save()}};V.sheet='cf';render()}
else if(a==='rst'){V.cf={m:'Hapus semua permintaan, profil, dan pengaturan master?',f:()=>{S=fresh();save()}};V.sheet='cf';render()}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});
document.addEventListener('input',e=>{const t=e.target,d=t.dataset;
if(d.f){S.cur[d.f]=t.value;save()}
else if(d.lk){const l=ln(d.l);if(d.lk==='qty'){const n=l.unit==='kg'?parseFloat(t.value.replace(',','.')):parseInt(t.value);l.qty=isNaN(n)||n<0?'':n}else l[d.lk]=t.value;save();const s=$('#sm');if(s)s.textContent=`${S.cur.lines.length} jenis • total ${sum(S.cur)}`;if(d.lk==='unit')render()}
else if(d.p){S.profile[d.p]=t.value;save()}
else if(d.mi)V.mi[d.mi]=t.value;
else if(d.d){S.doc=t.value;save();render()}
else if(d.q){V.q=t.value;if(d.q==='2')$('#gr').innerHTML=grid();else $('#hl').innerHTML=hl(S.reqs.filter(r=>(V.f==='all'||r.status===V.f)&&(r.no+r.name+r.ref).toLowerCase().includes(V.q.toLowerCase())))}});
let DL=null;
function mkpdf(r){const{jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),L=14,R=196;let y=18;
d.setFont('helvetica','bold');d.setFontSize(15);d.setTextColor(37,72,208);d.text('PERMINTAAN PACKAGING',L,y);d.setTextColor(15,23,42);d.setFontSize(10);d.text(S.profile.co||'',R,y,{align:'right'});y+=9;d.setFont('helvetica','normal');
[['No. Permintaan',r.no],['Tanggal',fd(r.date)],['Pemohon',(r.name||'-')+(r.dept?' ('+r.dept+')':'')],['Tujuan / No. Ref',r.ref||'-']].forEach(a=>{d.text(a[0],L,y);d.text(': '+a[1],L+36,y);y+=5.5});y+=4;
const hd=()=>{d.setFillColor(241,245,249);d.rect(L,y-4.5,R-L,7,'F');d.setFont('helvetica','bold');d.text('No',L+1,y);d.text('Item & varian',L+10,y);d.text('Keterangan',L+78,y);d.text('Qty',R-1,y,{align:'right'});y+=7;d.setFont('helvetica','normal')};hd();
r.lines.forEach((l,i)=>{const a=d.splitTextToSize(l.nm+(l.variant?' / '+l.variant:''),64),b=d.splitTextToSize(l.note||'-',68),h=Math.max(a.length,b.length)*5+2;if(y+h>272){d.addPage();y=18;hd()}d.text(String(i+1),L+1,y);d.text(a,L+10,y);d.text(b,L+78,y);d.text((l.qty===''?'-':String(l.qty))+' '+l.unit,R-1,y,{align:'right'});y+=h;d.setDrawColor(226,232,240);d.line(L,y-3.5,R,y-3.5)});
y+=3;d.setFont('helvetica','bold');d.text('Total: '+r.lines.length+' jenis item  |  Kuantitas: '+sum(r)+' unit',L,y);y+=7;d.setFont('helvetica','normal');
if(r.note){const t=d.splitTextToSize('Catatan khusus: '+r.note,R-L);d.text(t,L,y);y+=t.length*5+4}
if(y>240){d.addPage();y=18}y+=6;
['Pemohon','Mengetahui','Penerima'].forEach((t,i)=>{const x=L+i*62;d.rect(x,y,58,32);d.text(t,x+29,y+6,{align:'center'});d.text('( '+(i?'........':r.name||'........')+' )',x+29,y+28,{align:'center'})});
return d.output('arraybuffer')}
if(typeof claude!=='undefined'&&claude.use){claude.use('downloads').then(x=>{DL=x;render()}).catch(()=>{});}
render();
</script></body></html>
